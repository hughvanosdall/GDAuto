[workspace]
resolver = "2"
members = ["crates/grimlua-core", "crates/grimlua-dinput8"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
grimlua-core = { path = "crates/grimlua-core" }

[workspace.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Unwinding across the FFI boundary into the game's C++ frames is undefined
# behaviour, and a panic that reached the frame hook must never get there.
# There are two ways to guarantee that, and this project has used both:
#
#   panic = "abort"   -- nothing can unwind because nothing unwinds. Simple,
#                        and it was the original choice. But it makes *every*
#                        panic fatal to the game, which for a hardcore
#                        character means a deleted save.
#   panic = "unwind"  -- plus `catch_unwind` at our own boundary, which is
#                        `hook::update_hook`. A panic then stops grimlua and
#                        leaves Grim Dawn running.
#
# The second is strictly stronger, and abort turned out to be unworkable
# besides: mlua signals an error from a Rust callback by longjmping out
# through `lua_error`, which under `panic = "abort"` on MSVC trips
# `panic_cannot_unwind` and kills the process. That path is exactly the script
# instruction-budget guard, so with abort the mechanism protecting the game
# from an endless loop was itself the thing killing it.
#
# The obligation this creates: **no panic may cross an `extern` boundary.**
# The frame hook catches; the proxy's exports are naked tail-jumps with no
# Rust frame to unwind; mlua catches its own callbacks.
[profile.release]
panic = "unwind"
opt-level = 2
lto = true
codegen-units = 1
strip = false      # keep symbols; we attach a debugger to this

[profile.dev]
panic = "unwind"
